# Tests the Translation Manager and, for a version tag, builds BaDIKTranslationManager.exe.
#
# Safety: this workflow only READS the repository and uploads the exe as a *workflow artifact*.
# It does not create a release, does not deploy the website and does not push anything.
# (Publishing translation progress is done by the manager application itself, with a manual confirmation.)
name: Translation Manager

on:
  pull_request:
    paths: ["tools/translation-manager/**", "web/**", "tests/web/**", ".github/workflows/translation-manager.yml"]
  push:
    branches-ignore: ["main"]
    tags: ["manager-v*"]
    paths: ["tools/translation-manager/**", "web/**", "tests/web/**", ".github/workflows/translation-manager.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/translation-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

  ui-selftest:
    # Runs prehled/ui/selftest.js in a real browser (Edge is preinstalled on the Windows runner).
    # NOTE: added without being run in CI first (no browser on the author's PC) - it is allowed to fail until it has been
    # green once; then remove continue-on-error to make it a real gate.
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/translation-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: python -m pip install playwright
      - name: UI self-test in Edge
        run: python tests/ui/run_selftest_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-selftest-screenshot
          path: tools/translation-manager/tests/ui/selftest-result.png
          if-no-files-found: ignore

  build-exe:
    # only for tags like manager-v1.0.0 (or a manual run)
    if: startsWith(github.ref, 'refs/tags/manager-v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/translation-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build BaDIKTranslationManager.exe
        run: python -m PyInstaller --noconfirm --clean BaDIKTranslationManager.spec
      - name: Check that the exe exists
        run: if (-not (Test-Path dist/BaDIKTranslationManager.exe)) { throw "exe was not built" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: BaDIKTranslationManager-${{ github.ref_name }}
          path: tools/translation-manager/dist/BaDIKTranslationManager.exe
          if-no-files-found: error
